<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAAZ Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: #0d0d0d; color: #fff; min-height: 100vh; }

  .lockScreen {
    height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: radial-gradient(circle at 30% 20%, #3a0000, #120404 70%);
    padding: 20px;
  }
  .lockBox {
    background: #1a1a1a; padding: 30px 25px; border-radius: 16px;
    width: 90%; max-width: 340px; text-align: center;
    border: 1px solid rgba(255,69,0,0.25);
  }
  .lockBox h1 {
    background: linear-gradient(135deg, #FFD700, #FF4500);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; margin-bottom: 20px; font-size: 24px;
  }
  .lockBox input {
    width: 100%; padding: 12px; margin-bottom: 12px;
    border: 1px solid #333; border-radius: 8px; font-size: 15px;
    background: #0d0d0d; color: #fff;
  }
  .lockBox button {
    width: 100%; padding: 12px; border: none; border-radius: 8px;
    background: linear-gradient(135deg, #FF4500, #8B0000);
    color: white; font-size: 15px; font-weight: bold; cursor: pointer;
  }
  .lockError { color: #ff6b6b; font-size: 13px; margin-top: 10px; min-height: 16px; }

  .hidden { display: none !important; }

  .header {
    background: linear-gradient(135deg, #3a0000, #8B0000);
    padding: 15px; position: sticky; top: 0; z-index: 5;
  }
  .header h1 { font-size: 18px; margin-bottom: 10px; }
  .header input {
    width: 100%; padding: 10px; border-radius: 8px; border: none;
    background: #1a1a1a; color: #fff; font-size: 14px;
  }
  .statLine { color: #ffb; font-size: 12px; margin-top: 8px; }

  .userRow {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 15px; border-bottom: 1px solid #1f1f1f;
  }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, #FF4500, #8B0000);
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; color: #fff; background-size: cover; background-position: center;
  }
  .userInfo { flex: 1; overflow: hidden; }
  .userName { font-weight: bold; font-size: 15px; }
  .userUsername { color: #FF6B35; font-size: 13px; }
  .userEmail { color: #999; font-size: 12px; word-break: break-all; }
  .userBio { color: #888; font-size: 12px; margin-top: 2px; font-style: italic; }
  .userMeta { color: #666; font-size: 11px; margin-top: 3px; }

  .emptyMsg { text-align: center; padding: 40px 20px; color: #777; }
  .loadingMsg { text-align: center; padding: 40px 20px; color: #FF6B35; }
</style>
</head>
<body>

  <!-- SIMPLE LOCK SCREEN (soft protection, not real security) -->
  <div id="lockScreen" class="lockScreen">
    <div class="lockBox">
      <h1>🔐 RAAZ Admin</h1>
      <input type="password" id="adminPassInput" placeholder="Admin password daalo">
      <button id="unlockBtn">Andar Jao</button>
      <p id="lockError" class="lockError"></p>
    </div>
  </div>

  <!-- ADMIN PANEL -->
  <div id="adminPanel" class="hidden">
    <div class="header">
      <h1>👥 Sabhi RAAZ Users</h1>
      <input type="text" id="searchBox" placeholder="Naam ya username se search karo...">
      <div class="statLine" id="statLine">Loading...</div>
    </div>
    <div id="userList"></div>
    <div id="emptyMsg" class="emptyMsg hidden">Koi user nahi mila</div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    // 🔴 YAHAN APNA PASSWORD SET KARO (jo bhi chaho, sirf tumhe pata ho)
    const ADMIN_PASSWORD = "omnamahshivayprinceyaduvanshi8765432187654321";

    const lockScreen = document.getElementById("lockScreen");
    const adminPanel = document.getElementById("adminPanel");
    const adminPassInput = document.getElementById("adminPassInput");
    const unlockBtn = document.getElementById("unlockBtn");
    const lockError = document.getElementById("lockError");
    const searchBox = document.getElementById("searchBox");
    const userList = document.getElementById("userList");
    const statLine = document.getElementById("statLine");
    const emptyMsg = document.getElementById("emptyMsg");

    let allUsers = [];

    unlockBtn.addEventListener("click", checkPassword);
    adminPassInput.addEventListener("keypress", (e) => { if (e.key === "Enter") checkPassword(); });

    function checkPassword() {
      if (adminPassInput.value === ADMIN_PASSWORD) {
        lockScreen.classList.add("hidden");
        adminPanel.classList.remove("hidden");
        loadAllUsers();
      } else {
        lockError.textContent = "Galat password!";
      }
    }

    async function loadAllUsers() {
      statLine.textContent = "Loading...";
      try {
        const snapshot = await db.collection("users").orderBy("username").get();
        allUsers = snapshot.docs.map(doc => ({ uid: doc.id, ...doc.data() }));
        statLine.textContent = `Total ${allUsers.length} users`;
        renderUsers(allUsers);
      } catch (err) {
        statLine.textContent = "Error: " + err.message;
      }
    }

    function renderUsers(users) {
      userList.innerHTML = "";
      emptyMsg.classList.toggle("hidden", users.length > 0);

      users.forEach((u) => {
        const row = document.createElement("div");
        row.classList.add("userRow");

        const lastSeenText = u.lastSeen ? new Date(u.lastSeen.seconds * 1000).toLocaleString("en-IN") : "Pata nahi";

        row.innerHTML = `
          <div class="avatar" style="${u.photoBase64 ? `background-image:url(${u.photoBase64})` : ''}">
            ${u.photoBase64 ? '' : (u.name || '?').charAt(0).toUpperCase()}
          </div>
          <div class="userInfo">
            <div class="userName">${u.name || '(naam nahi hai)'}</div>
            <div class="userUsername">@${u.username || '(username nahi hai)'}</div>
            <div class="userEmail">${u.email || ''}</div>
            ${u.bio ? `<div class="userBio">"${u.bio}"</div>` : ''}
            <div class="userMeta">Last active: ${lastSeenText}</div>
          </div>
        `;
        userList.appendChild(row);
      });
    }

    searchBox.addEventListener("input", () => {
      const q = searchBox.value.trim().toLowerCase();
      if (!q) { renderUsers(allUsers); return; }
      const filtered = allUsers.filter(u =>
        (u.name || "").toLowerCase().includes(q) ||
        (u.username || "").toLowerCase().includes(q) ||
        (u.email || "").toLowerCase().includes(q)
      );
      renderUsers(filtered);
    });
  </script>
</body>
</html>
